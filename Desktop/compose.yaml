services:
  cgal:
    build:
      context: ./cgal
      dockerfile: DockerFile
    working_dir: /cgal
    volumes:
    - ./cgal:/cgal
    - ./colmap:/colmap
    stdin_open: true
    tty: true
    gpus: all
    command: ["bash"]

  colmap:
    build:
      context: ./colmap
      dockerfile: DockerFile
    working_dir: /colmap
    volumes:
    - ./cgal:/cgal
    - ./colmap:/colmap
    stdin_open: true
    tty: true
    gpus: all
    command: ["bash"]
